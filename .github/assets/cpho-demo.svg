<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="CPHO CLI terminal demo">
  <rect width="920" height="420" fill="#0b1020"/>
  <rect x="18" y="18" width="884" height="384" rx="8" fill="#111827" stroke="#374151"/>
  <circle cx="42" cy="42" r="6" fill="#ef4444"/>
  <circle cx="62" cy="42" r="6" fill="#f59e0b"/>
  <circle cx="82" cy="42" r="6" fill="#22c55e"/>
  <text x="34" y="82" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
    <tspan x="34" dy="0">$ uv run cpho index build examples</tspan>
    <tspan x="34" dy="28">indexed 1 problem, reused OCR cache</tspan>
    <tspan x="34" dy="36">$ uv run cpho repl --workspace examples</tspan>
    <tspan x="34" dy="28">cpho&gt; /search 力学</tspan>
    <tspan x="34" dy="28">1  demo-p1  力学/动力学  newton</tspan>
    <tspan x="34" dy="28">cpho&gt; /show 1</tspan>
    <tspan x="34" dy="28">cpho&gt; /solve --auto-confirm</tspan>
    <tspan x="34" dy="28">✓ solve: 标答审查完成</tspan>
    <tspan x="34" dy="28">cpho&gt; /explain --tone teacher --tone dense</tspan>
    <tspan x="34" dy="28">✓ explain: exported demo-p1.explain.md</tspan>
    <tspan x="34" dy="28">cpho&gt; /search-related --top 5</tspan>
  </text>
</svg>
