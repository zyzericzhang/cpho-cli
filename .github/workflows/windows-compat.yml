name: Windows compatibility

on:
  pull_request:
  push:

jobs:
  windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Check CLI help
        run: uv run cpho --help

      - name: Run packaging diagnostics
        run: uv run cpho diagnostics --packaging-smoke

      - name: Run Windows smoke
        shell: pwsh
        run: pwsh scripts/phase09_windows_smoke.ps1
