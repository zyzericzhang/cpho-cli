name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Build PyInstaller bundle
        shell: pwsh
        run: pwsh -NoProfile -File packaging/build_windows.ps1

      - name: Run packaged smoke
        shell: pwsh
        run: pwsh -NoProfile -File packaging/smoke_packaged_windows.ps1 -ExecutablePath dist/cpho/cpho.exe -Label "Release PyInstaller smoke"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          $Version = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $env:CPHO_APP_VERSION = $Version
          $env:CPHO_DIST_DIR = (Resolve-Path "dist/cpho").Path
          $env:CPHO_INSTALLER_OUTPUT_DIR = (Resolve-Path "dist/installer").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpho-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Setup = Get-ChildItem -Path dist/installer/*.exe | Select-Object -First 1
          if ($null -eq $Setup) {
            throw "Windows installer not found."
          }
          gh release view "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" --notes "CPHO CLI $env:GITHUB_REF_NAME"
          }
          gh release upload "$env:GITHUB_REF_NAME" $Setup.FullName --clobber
